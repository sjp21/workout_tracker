<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stimulus">
<meta name="theme-color" content="#0b0d0c">
<title>Stimulus — Evidence-Based Hypertrophy Tracker</title>
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
  <header>
    <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:12px;">
      <div>
        <div class="logo">St<span>i</span>mulus</div>
        <div class="tagline">Evidence-Based · Dumbbell Hypertrophy · 8-Week Block</div>
      </div>
      <div id="syncStatus" class="sync-indicator"></div>
    </div>
  </header>

  <div class="mode-switch">
    <button class="mode-btn active" id="modeToday" data-mode="today">Today<span class="icon">Overview</span></button>
    <button class="mode-btn" id="modeTrain" data-mode="train">Train<span class="icon">Lift</span></button>
    <button class="mode-btn" id="modeFuel" data-mode="fuel">Fuel<span class="icon">Nutrition</span></button>
  </div>

  <div id="todayView"></div>
  <div id="trainView" style="display:none;">
    <div class="day-tabs" id="dayTabs"></div>
    <div id="dayView"></div>
  </div>
  <div id="nutriView" style="display:none;"></div>
</div>

<div class="nav-bottom">
  <button class="nav-btn" id="navHistory">History</button>
  <button class="nav-btn" id="navGuide">How To Use</button>
  <button class="nav-btn primary" id="navSave">Save Session</button>
</div>

<div class="modal-bg" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
